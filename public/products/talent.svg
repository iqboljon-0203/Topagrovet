<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 260" fill="none">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#784212"/>
      <stop offset="40%" stop-color="#BA6A21"/>
      <stop offset="100%" stop-color="#6E3B0E"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="white" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Wider bottle - WG bag style -->
  <rect x="35" y="30" width="90" height="14" rx="5" fill="#6E3B0E"/>
  <rect x="30" y="42" width="100" height="185" rx="6" fill="url(#body)"/>
  <rect x="30" y="42" width="32" height="185" rx="6" fill="url(#shine)"/>
  <rect x="38" y="58" width="84" height="120" rx="5" fill="white"/>
  <rect x="38" y="58" width="84" height="28" rx="5" fill="#BA6A21"/>
  <text x="80" y="73" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" font-weight="800" fill="white">TALENT SUPER</text>
  <text x="80" y="85" text-anchor="middle" font-family="Arial,sans-serif" font-size="6" fill="rgba(255,255,255,0.9)">WG</text>
  <text x="80" y="108" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="800" fill="#784212">750 g/kg</text>
  <line x1="45" y1="118" x2="115" y2="118" stroke="#BA6A21" stroke-width="0.8" opacity="0.4"/>
  <text x="80" y="133" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#555">Trifloksistrobin</text>
  <text x="80" y="146" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#777">Fungisid</text>
  <text x="80" y="160" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#888">250 g | 500 g</text>
  <rect x="38" y="165" width="84" height="13" rx="0" fill="#FEF9E7"/>
  <text x="80" y="174" text-anchor="middle" font-family="Arial,sans-serif" font-size="6" fill="#784212" font-weight="600">FUNGISID</text>
</svg>
