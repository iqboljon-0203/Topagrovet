<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 260" fill="none">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C0392B"/>
      <stop offset="40%" stop-color="#E74C3C"/>
      <stop offset="100%" stop-color="#922B21"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7B241C"/>
      <stop offset="100%" stop-color="#A93226"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="white" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Bottle cap -->
  <rect x="58" y="8" width="44" height="16" rx="4" fill="url(#cap)"/>
  <!-- Neck -->
  <rect x="62" y="22" width="36" height="18" rx="3" fill="url(#body)"/>
  <!-- Body -->
  <rect x="40" y="38" width="80" height="190" rx="10" fill="url(#body)"/>
  <!-- Shine highlight -->
  <rect x="40" y="38" width="28" height="190" rx="10" fill="url(#shine)"/>
  <!-- Label background -->
  <rect x="46" y="70" width="68" height="110" rx="5" fill="white"/>
  <!-- Label content -->
  <text x="80" y="97" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" font-weight="700" fill="#C0392B">MS-Oxytet</text>
  <text x="80" y="114" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="800" fill="#C0392B">20%</text>
  <text x="80" y="130" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="800" fill="#C0392B">LA</text>
  <line x1="52" y1="138" x2="108" y2="138" stroke="#E74C3C" stroke-width="1" opacity="0.4"/>
  <text x="80" y="153" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#666">Oksitetrasiklin 20%</text>
  <text x="80" y="165" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#666">100ml / 250ml / 500ml</text>
  <!-- Volume lines -->
  <line x1="117" y1="160" x2="119" y2="160" stroke="white" stroke-width="1.5"/>
  <line x1="117" y1="140" x2="119" y2="140" stroke="white" stroke-width="1.5"/>
  <line x1="117" y1="120" x2="119" y2="120" stroke="white" stroke-width="1.5"/>
</svg>
